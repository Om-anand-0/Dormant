name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Overrides the local .python-version pin for every uv command below.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads the version from git tags
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Real shells for the hook integration tests (bash ships with every runner).
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # Fails below the 80% overall floor set in [tool.coverage.report] fail_under.
      - run: uv run pytest --cov=dormant --cov-report=xml --cov-report=term
      - name: Coverage floor for archive core (90%)
        run: uv run coverage report --include="src/dormant/archiver.py,src/dormant/restorer.py,src/dormant/index.py" --fail-under=90
      - run: uv run dormant --version

  lint-shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck is preinstalled on ubuntu runners. It doesn't support zsh or fish.
      - name: shellcheck bash hooks
        run: |
          shopt -s nullglob
          files=(src/dormant/hooks/*.bash)
          if [ ${#files[@]} -eq 0 ]; then echo "No bash hooks yet"; exit 0; fi
          shellcheck "${files[@]}"

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('extensions/vscode/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - if: hashFiles('extensions/vscode/package.json') != ''
        run: npm ci
      - if: hashFiles('extensions/vscode/package.json') != ''
        run: npm run compile
      - if: hashFiles('extensions/vscode/package.json') != ''
        run: npm test
